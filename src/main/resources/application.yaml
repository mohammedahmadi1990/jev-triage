server.port: 8081
spring:
  application:
    name: jev-triage
  config:
    import: optional:file:.env[.properties]
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-haiku-5-5

jev:
  base-url: https://api.typesafe.ai
  model: jev-1.13.0
  api-key: ${TYPESAFE_API_KEY}
  timeout: 5s
